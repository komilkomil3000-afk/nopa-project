name: nopa_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  video_player: ^2.8.2
  http: ^1.2.1
  file_picker: ^8.1.2
  confetti: ^0.7.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  record: ^7.1.1
  audioplayers: ^6.0.0
  shamsi_date: ^1.1.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/nopa_logo.svg
    - assets/fonts/
    - assets/fonts/YekanBakh-Regular.ttf
    - assets/fonts/YekanBakh-Medium.ttf
    - assets/fonts/YekanBakh-Bold.ttf

  fonts:
    - family: YekanBakh
      fonts:
        - asset: assets/fonts/YekanBakh-Regular.ttf
          weight: 400
        - asset: assets/fonts/YekanBakh-Medium.ttf
          weight: 500
        - asset: assets/fonts/YekanBakh-Bold.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/YekanBakh-Regular.ttf
          weight: 400
        - asset: assets/fonts/YekanBakh-Medium.ttf
          weight: 500
        - asset: assets/fonts/YekanBakh-Bold.ttf
          weight: 700
