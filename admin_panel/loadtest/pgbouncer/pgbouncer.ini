; PgBouncer for the load-test sandbox. Mirrors production's pooler (Supavisor on :6543, transaction mode).
; Sizing rule: max_db_connections <= postgres max_connections - (migrations + admin + monitoring headroom).

[databases]
nopa_loadtest = host=postgres port=5432 dbname=nopa_loadtest

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = nopa_lt
stats_users = nopa_lt

; Transaction pooling: a server connection is held only for the length of a transaction.
; Prisma must use ?pgbouncer=true (no named prepared statements) with this mode.
pool_mode = transaction

; Clients = sum of every app process's Prisma connection_limit (+ tools). Cheap; keep generous.
max_client_conn = 500
; Real Postgres connections per (db,user) pair. ~ 2-4 x CPU cores of the DB server is a good start.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
; Hard cap on server connections to this DB, whatever the pool math says
max_db_connections = 40

server_idle_timeout = 60
server_lifetime = 3600
; A client waiting this long for a server connection gets an error instead of hanging forever
query_wait_timeout = 30
; Prisma sends these startup params; PgBouncer must not reject them
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
stats_period = 30
